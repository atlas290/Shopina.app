<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/.../logo-shopina.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <!-- Balises pour l'aperçu WhatsApp -->
  <meta property="og:title" content="Découvrez ma boutique sur Shopina">
  <meta property="og:description" content="Parcourez mes produits et passez commande directement sur WhatsApp !">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://raw.githubusercontent.com/atlas290/Shopina.app/main/assets/logo-preview.png">

  <meta name="theme-color" content="#E91E63">
  <title>Havana Shop — Vitrine</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/client.css">
  
  <style>
    @keyframes splashFade {
      0%   { opacity: 1; }
      70%  { opacity: 1; }
      100% { opacity: 0; pointer-events: none; visibility: hidden; }
    }
  </style>
</head>
  <body>

  <!-- ============ SPLASH SCREEN ============ -->
  <div id="splash-screen" style="
    position: fixed; inset: 0; z-index: 9999;
    background: var(--accent);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; color: #fff;
    animation: splashFade 0.5s ease forwards;
  ">
    <div style="
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(255,255,255,0.22);
      border: 2px solid rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 800;
    ">S</div>
    <div style="font-size: 22px; font-weight: 800; letter-spacing: 1.5px;">Shopina</div>
  </div>

  <!-- ============ HEADER ============ -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">H</div>
      <div class="brand-text">
        <div class="shop-name">Havana Shop</div>
        <div class="shop-slogan">Prêt-à-porter &amp; cosmétiques · Cotonou</div>
        <div class="shop-info-badges" id="shopInfoBadges"></div>
      </div>
      <button class="cart-btn" aria-label="Panier">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-count" data-empty="true">0</span>
      </button>
    </div>
  </header>

  <!-- ============ SHOP BAR ============ -->
  <div class="shop-bar">
    <a class="wa-btn" href="https://wa.me/22967020586" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#25D366" aria-hidden="true">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg> 
      Discuter sur WhatsApp
    </a>
    <span class="shop-url">shopina.shop/havana-shop</span>
    <a href="accueil.html" style="font-size:11px;color:var(--text-muted);text-decoration:none;margin-left:auto;">← Retour à Shopina</a>
  </div>

  <!-- ============ FILTERS ============ -->
  <nav class="filters" aria-label="Filtrer les produits">
    <button class="filter active" data-filter="Tout">Tout</button>
    <button class="filter" data-filter="Vêtement">Vêtements</button>
    <button class="filter" data-filter="Cosmétique">Cosmétiques</button>
  </nav>

  <!-- ============ GRID (généré par JS) ============ -->
  <main class="grid" aria-live="polite"></main>

  <!-- ============ PANIER ============ -->
  <div id="cart-backdrop" class="backdrop"></div>
  <aside id="cart-drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Panier">
    <div class="drawer-head">
      <h2>Mon panier</h2>
      <button aria-label="Fermer" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text-main);background:transparent;border:none;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="drawer-body">
      <div class="empty-cart">Votre panier est vide.</div>
    </div>
    
    <!-- PIED DU PANIER AVEC GESTION LIVRAISON ET MOBILE MONEY -->
    <div class="drawer-foot">
      <div class="delivery-row" style="margin-bottom: 12px;">
        <label for="delivery-zone" style="font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; display: block;">Zone de livraison</label>
        <select id="delivery-zone" style="width: 100%; min-height: 44px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 14px;">
          <option value="">Choisir une zone...</option>
          <option value="Cotonou">Cotonou (+1 000 FCFA)</option>
          <option value="Calavi">Calavi (+1 500 FCFA)</option>
          <option value="Autre">Autre (+2 000 FCFA)</option>
        </select>
      </div>
      
      <div class="total-row" style="margin-bottom: 4px;">
        <span>Sous-total</span>
        <strong id="cart-subtotal">0 FCFA</strong>
      </div>
      
      <div class="total-row" style="margin-bottom: 4px; font-size: 13px;">
        <span>Livraison</span>
        <span id="cart-delivery">0 FCFA</span>
      </div>
      
      <div class="total-row" style="margin-bottom: 12px; border-top: 1px solid var(--border-color); padding-top: 8px;">
        <span>Total</span>
        <strong id="cart-total">0 FCFA</strong>
      </div>
      
      <button class="btn-whatsapp" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Envoyer la commande sur WhatsApp
      </button>
    </div>
  </aside>

  <!-- ============ FICHE PRODUIT ============ -->
  <div id="product-overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Fiche produit">
    <div class="overlay-panel">
      <div class="overlay-scroll">
        <div class="overlay-img">
          <button class="back-btn" aria-label="Retour">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <span class="ph-name"></span>
        </div>
        <div class="overlay-body"></div>
      </div>
      <div class="overlay-footer">
        <button class="btn-primary" disabled>Ajouter au panier</button>
      </div>
    </div>
  </div>

  <script>
    setTimeout(function () {
      var splash = document.getElementById('splash-screen');
      if (splash) splash.remove();
    }, 1000);
  </script>

  <!-- Scripts Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<!-- BARRE PANIER FIXE EN BAS -->
  <div id="floating-cart-bar" class="floating-cart-bar">
    <div class="floating-cart-info">
      <span class="floating-cart-count">1 article</span>
      <span class="floating-cart-total">15 000 FCFA</span>
    </div>
    <button type="button" class="floating-cart-btn">Voir le panier</button>
  </div>
    
  <!-- Ton script client -->
  <script src="js/client.js"></script>
</body>
</html>
