<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/.../logo-shopina.jpg">


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shopina — Administration</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <style>
    body { background: var(--bg-main); font-family: var(--font-main); color: var(--text-main); padding: 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    .admin-title { font-size: 20px; font-weight: 800; }
    .login-box { max-width: 400px; margin: 100px auto; background: var(--bg-card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border-color); }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid var(--border-color); border-radius: var(--radius); background: var(--bg-main); color: var(--text-main); }
    .vendor-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .vendor-name { font-weight: 800; font-size: 16px; }
    .vendor-info { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .vendor-badge { background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- ÉCRAN DE CONNEXION ADMIN -->
  <div id="login-section" class="login-box">
    <h2 style="margin-bottom: 20px; text-align: center;">Accès Administration</h2>
    <input type="email" id="adminEmail" placeholder="Email administrateur">
    <input type="password" id="adminPassword" placeholder="Mot de passe">
    <button class="btn-primary" id="btnLoginAdmin" style="width: 100%;">Se connecter</button>
  </div>

  <!-- DASHBOARD ADMIN -->
  <div id="dashboard-section" class="hidden">
    <div class="admin-header">
      <div class="admin-title">Pilotage Shopina</div>
      <button class="btn-secondary" id="btnLogoutAdmin" style="padding: 8px 16px; min-height: 40px;">Déconnexion</button>
    </div>

    <div style="margin-bottom: 16px; font-size: 14px; color: var(--text-muted);">
      Total vendeuses inscrites : <strong id="totalVendors" style="color: var(--text-main);">0</strong>
    </div>

    <div id="vendors-list"></div>
  </div>

  <!-- SCRIPTS FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
