<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification du paiement...</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #FAFAFA; color: #333; text-align: center; padding: 20px; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #E91E63; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="loader"></div>
    <h2>Vérification de votre paiement en cours...</h2>
    <p>Merci de patienter quelques secondes.</p>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCuge89Ct4HX-r4wUnaCqb3qdToL9H-3O0",
      authDomain: "shopina-6172d.firebaseapp.com",
      projectId: "shopina-6172d",
      storageBucket: "shopina-6172d.firebasestorage.app",
      messagingSenderId: "1068229855736",
      appId: "1:1068229855736:web:7583e82691e8a0eeb72e0d"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Récupérer les paramètres de l'URL renvoyés par PaiementPro
    const urlParams = new URLSearchParams(window.location.search);
    const reference = urlParams.get('reference') || urlParams.get('referenceNumber');
    const transactionId = urlParams.get('transaction_id') || urlParams.get('id');

    async function verifierPaiement() {
      const user = auth.currentUser;
      
      if (!user) {
        alert("Vous devez être connecté.");
        window.location.href = "vendeur.html";
        return;
      }

      if (!reference && !transactionId) {
        alert("Référence de paiement introuvable.");
        window.location.href = "vendeur.html";
        return;
      }

      try {
        // Appel à l'API de PaiementPro pour vérifier la transaction
        // On utilise l'API Password fourni dans le tableau de bord
        const idMarchand = 'PP-F92897';
        const apiPassword = '04781'; 
        const refToCheck = reference || transactionId;

        // Requête de vérification (selon la documentation standard PaiementPro)
        const response = await fetch(`https://www.paiementpro.net/webservice/onlinepayment/check/${idMarchand}/${apiPassword}/${refToCheck}`);
        
        // Si l'API retourne un texte ou du JSON, on gère
        const textResponse = await response.text();
        
        // On considère que si la réponse contient "SUCCESS" ou "success", c'est validé.
        // (On adaptera selon la vraie réponse de l'API si besoin)
        if (textResponse.toLowerCase().includes('success') || textResponse.toLowerCase().includes('payé') || response.ok) {
          
          // CALCUL DES 30 JOURS
          const dateFin = new Date();
          dateFin.setDate(dateFin.getDate() + 30);

          // Mise à jour de la base de données Firebase
          await db.collection('vendeurs').doc(user.uid).update({
            date_fin_abonnement: firebase.firestore.Timestamp.fromDate(dateFin)
          });

          alert("✅ Paiement confirmé ! Votre abonnement est actif pour 30 jours.");
          window.location.href = "vendeur.html";
        } else {
          alert("❌ Le paiement n'a pas été validé. Si vous avez été débité, contactez le support.");
          window.location.href = "vendeur.html";
        }
      } catch (error) {
        console.error("Erreur:", error);
        alert("Erreur de vérification. Contactez le support.");
        window.location.href = "vendeur.html";
      }
    }

    // On attend que Firebase charge l'utilisateur
    auth.onAuthStateChanged((user) => {
      if (user) {
        verifierPaiement();
      }
    });
  </script>
</body>
</html>
